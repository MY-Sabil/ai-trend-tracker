name: Weekly AI Trend Tracker

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai scikit-learn numpy matplotlib python-dotenv umap-learn

      - name: Run Trend Tracker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clusters/history.jsonl trending_repos.jsonl archive/ trends/ clusters.png
          
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AI trends for the week" && git push)
